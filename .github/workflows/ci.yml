name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (server)
        run: pnpm --filter @cortexi/server exec tsc --noEmit

      - name: Typecheck (web)
        run: pnpm --filter @cortexi/web exec tsc --noEmit

      - name: Build web
        run: pnpm --filter @cortexi/web build

      - name: Unit tests
        run: pnpm test

      - name: API smoke test
        run: |
          pnpm dev:server &
          sleep 10
          curl -sf http://localhost:8787/api/health
          curl -sf http://localhost:8787/api/settings
