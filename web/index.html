<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cortexi — AI Video Generator</title>
    <meta name="description" content="Cortexi — free, local-first AI video generator. Prompt to storyboard, voiceover, captions and rendered MP4." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cortexi — AI Video Generator" />
    <meta property="og:description" content="Free, local-first AI video generator: prompt → storyboard → voiceover → MP4." />
    <meta property="og:image" content="/logo.jpeg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/logo.jpeg" />
    <style>
      /* Pre-paint loading splash (replaced when React mounts) */
      .splash { text-align: center; font-family: system-ui, sans-serif; color: #8e8e9e; background: #0A0A0E; position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      .splash img { width: 96px; height: 96px; border-radius: 24px; animation: pulse 1.6s ease-in-out infinite; }
      .splash span { letter-spacing: 0.2em; text-transform: uppercase; font-size: 12px; }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.96); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <img src="/logo.jpeg" alt="Cortexi logo" />
        <span>Loading Cortexi…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
