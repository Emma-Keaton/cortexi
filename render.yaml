services:
  - type: web
    name: cortexi-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    # Optional persistence. The free-tier Render web service may not include a
    # disk; uncomment and verify your plan supports it. Mounts /app/assets so
    # rendered output, uploads, and brand-settings survive a restart.
    #
    # disks:
    #   - name: assets
    #     mountPath: /app/assets
    #     sizeGB: 1
    envVars:
      # --- Runtime (safe defaults; keep in the file) ---
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8787"
      # Free tier: users render in their own browser; the backend only plans + voices.
      - key: CORTEXI_ENABLE_SERVER_RENDER
        value: "0"

      # --- LLM (shared free route via Hugging Face Router). Set HF_TOKEN in the
      #     dashboard. If unset, /api/plan falls back to the offline rule-based
      #     storyboard, so the app still runs with zero secrets. ---
      - key: HF_TOKEN
        sync: false
      - key: CORTEXI_HF_MODEL
        value: "Qwen/Qwen2.5-1.5B-Instruct"
      - key: CORTEXI_HF_INFERENCE_URL
        value: "https://router.huggingface.co/v1/chat/completions"

      # --- Optional: server-side bring-your-key LLM fallbacks (leave unset to rely on HF_TOKEN). ---
      - key: CORTEXI_GROQ_KEY
        sync: false
      - key: CORTEXI_GEMINI_KEY
        sync: false

      # --- CORS: your Vercel web origin(s), comma-separated. Set AFTER the web
      #     is deployed so the backend allows cross-origin /api + /assets calls. ---
      - key: CORTEXI_WEB_ORIGIN
        sync: false

      # --- Text-to-speech voices shown in the app. NOTE: edge-tts uses Microsoft's
      #     consumer endpoint (ToS-grey for a public ad-supported product) - see report.
      #     Clear EDGE_TTS_VOICES and rely on PIPER/KOKORO for a fully clean default. ---
      - key: PIPER_VOICES
        value: "en_US-amy-medium,en_US-ryan-medium,en_GB-alan-medium,en_GB-jenny-diode"
      - key: KOKORO_VOICES
        value: "af_heart,af_bella,am_michael,bf_emma,bm_george,af_nicole,am_adam,bf_isabella,bm_fable,af_sarah,am_musk"
      - key: EDGE_TTS_VOICES
        value: "en-US-AriaNeural,en-US-GuyNeural,en-US-JennyNeural,en-GB-SoniaNeural,en-AU-NatashaNeural,en-IN-NeerjaNeural"
